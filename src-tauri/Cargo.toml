[package]
name = "huangguo-client"
version = "1.1.0"
description = "HGhub · 黄果短剧客户端"
authors = ["HGhub"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "huangguo_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "=2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 注意：system-proxy 必须显式列出。关掉 default-features 会连带丢掉它，
# 客户端就完全不看 Windows 系统代理（注册表 ProxyEnable/ProxyServer）而直连，
# 症状正是「浏览器能开官网、HGhub 打不开」。见 src/net.rs 顶部说明。
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "system-proxy",
  "gzip",
  "brotli",
  "json",
  "charset",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "fs", "io-util"] }
futures-util = "0.3"
aes = "0.8"
md-5 = "0.10"
sha2 = "0.10"
base64 = "0.22"
percent-encoding = "2"
once_cell = "1"
url = "2"

[target.'cfg(target_os = "ios")'.dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
uuid = { version = "1", features = ["v4"] }
block2 = "0.6"
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSError", "NSString", "NSURL", "NSValue"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = [
  "std", "block2", "UIOrientation", "UIResponder", "UIScene", "UIView",
  "UIViewController", "UIWindow", "UIWindowScene", "UIWindowSceneGeometryPreferences",
  "UIWindowSceneGeometryPreferencesIOS", "UIColor", "UIImage", "UIGraphicsRenderer",
  "UIGraphicsImageRenderer", "objc2-core-foundation",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
